# Serves the production Angular bundle and proxies /api to the api container.
# Same origin for app + API, so the browser needs no CORS at all — this is
# what the production environment's apiBaseUrl of '/api' was designed for.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: deep links (/board, /login) resolve to index.html and the
    # Angular router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
