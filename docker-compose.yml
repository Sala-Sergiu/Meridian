# Meridian demo stack: `docker compose up` from a clean checkout brings up
# MSSQL + the API; the API applies EF migrations (schema + HasData seed) once
# SQL Server reports healthy. Swagger: http://localhost:5044/swagger
#
# The SA password below is a DEV/DEMO credential only (same as the default in
# appsettings.json); override with MSSQL_SA_PASSWORD for anything else.

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Password123}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Meridian.Api/Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      # Development turns on Swagger and the localhost:4200 CORS policy —
      # right for a demo stack, not for a real deployment.
      ASPNETCORE_ENVIRONMENT: Development
      # Environment variables outrank appsettings*.json, so this beats the
      # local-dev connection string in appsettings.Development.json.
      ConnectionStrings__Default: "Server=mssql,1433;Database=Meridian;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};TrustServerCertificate=True;Encrypt=False"
      Database__ApplyMigrationsAtStartup: "true"
      # Demo convenience: assigns the seeded template to the seeded hire via
      # the normal (idempotent) assignment flow — no HasData for boards.
      Database__SeedDemoBoard: "true"
    ports:
      # Same host port as local dev (launchSettings), so the Angular dev
      # server's apiBaseUrl works unchanged against the compose stack.
      - "5044:8080"

volumes:
  mssql-data:
